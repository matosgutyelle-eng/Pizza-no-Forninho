<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel — Pizza no Forninho</title><style>:root{--navy:#06142c;--blue:#0866ff;--gold:#e6b83d}*{box-sizing:border-box}body{margin:0;background:#eef3fa;color:#10264a;font-family:Inter,system-ui,Arial}.head{background:var(--navy);color:white;padding:18px}.wrap{max-width:1100px;margin:auto;padding:20px}.card{background:white;border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:0 10px 30px #16345a12}.btn{padding:12px 16px;border:0;border-radius:9px;font-weight:800;cursor:pointer}.primary{background:var(--blue);color:#fff}.danger{background:#e53e3e;color:#fff}.good{background:#16a34a;color:#fff}.input{width:100%;padding:11px;border:1px solid #c6d0df;border-radius:8px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hidden{display:none}.item{border:1px solid #d9e1ec;padding:12px;border-radius:10px;margin:8px 0}.muted{color:#6c7b91}@media(max-width:750px){.grid,.row{grid-template-columns:1fr}}</style></head><body><div class="head"><div class="wrap"><b>Pizza no Forninho</b> · Painel do proprietário</div></div><main class="wrap"><div id="login" class="card"><h2>Entrar</h2><input id="pass" class="input" type="password" placeholder="Senha do painel"><button id="loginBtn" class="btn primary" style="margin-top:10px">ENTRAR</button><p id="loginMsg" class="muted"></p></div><div id="panel" class="hidden"><div class="card"><h2>Status da pizzaria</h2><p id="status"></p><button id="toggle" class="btn good"></button><p class="muted">Use este botão quando realmente começar ou terminar o atendimento. Não há horário automático.</p></div><div class="card"><h2>Pedidos</h2><button class="btn primary" onclick="loadAdmin()">ATUALIZAR</button><div id="orders"></div></div><div class="card"><h2>Configurações de entrega</h2><div class="grid"><label>Até 300m<input id="d1" class="input"></label><label>301–700m<input id="d2" class="input"></label><label>701–1000m<input id="d3" class="input"></label><label>Acima de 1km<input id="d4" class="input"></label><label>Limite (m)<input id="dmax" class="input"></label></div><button class="btn primary" style="margin-top:12px" onclick="saveSettings()">SALVAR</button></div><div class="card"><h2>Adicionar sabor</h2><div class="grid"><input id="fn" class="input" placeholder="Nome"><select id="fc" class="input"><option>Tradicionais</option><option>Especiais</option><option>Premium</option><option>Especiais da casa</option><option>Doces</option></select><input id="fp" class="input" type="number" step="0.01" placeholder="Acréscimo"><input id="fi" class="input" placeholder="URL da foto (opcional)"></div><button class="btn primary" style="margin-top:12px" onclick="addFlavor()">ADICIONAR SABOR</button></div><div class="card"><h2>Sabores atuais</h2><div id="flavors"></div></div><div class="card"><h2>Adicionar bebida/produto</h2><div class="grid"><input id="pn" class="input" placeholder="Nome"><input id="pp" class="input" type="number" step="0.01" placeholder="Preço"><input id="pi" class="input" placeholder="URL da foto (opcional)"></div><button class="btn primary" style="margin-top:12px" onclick="addProduct()">ADICIONAR</button><div id="products"></div></div></div></main><script>let cfg,adm;async function login(){const r=await fetch('/api/admin-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('pass').value})});if(!r.ok){document.getElementById('loginMsg').textContent='Senha inválida.';return}document.getElementById('login').classList.add('hidden');document.getElementById('panel').classList.remove('hidden');loadAdmin()}document.getElementById('loginBtn').onclick=login;async function loadAdmin(){const r=await fetch('/api/admin');if(!r.ok){location.reload();return}adm=await r.json();cfg=(await fetch('/api/config')).json?await (await fetch('/api/config')).json():null;renderAdmin();}async function renderAdmin(){const c=await (await fetch('/api/config')).json();cfg=c;const s=c.settings;document.getElementById('status').textContent=s.store_open==='1'?'🟢 PIZZARIA ABERTA':'🔴 PIZZARIA FECHADA';document.getElementById('toggle').textContent=s.store_open==='1'?'FECHAR PIZZARIA':'ABRIR PIZZARIA';document.getElementById('toggle').className='btn '+(s.store_open==='1'?'danger':'good');document.getElementById('toggle').onclick=()=>saveSettings({store_open:s.store_open==='1'?'0':'1'});d1.value=s.delivery_0_300;d2.value=s.delivery_301_700;d3.value=s.delivery_701_1000;d4.value=s.delivery_1001_plus;dmax.value=s.delivery_max_m;document.getElementById('orders').innerHTML=adm.orders.map(o=>`<div class="item"><b>#${o.id} — ${o.customer_name}</b><br>${o.status} · ${o.payment_method} · R$ ${Number(o.total).toFixed(2).replace('.',',')}<br>${o.fulfillment==='DELIVERY'?(o.street+', '+o.number+' · '+Math.round(o.distance_m)+'m · entrega R$ '+Number(o.delivery_fee).toFixed(2).replace('.',',')):'Retirada na loja'}<br><small>${o.notes||''}</small></div>`).join('')||'<p class="muted">Nenhum pedido.</p>';document.getElementById('flavors').innerHTML=c.flavors.map(f=>`<div class="item"><b>${f.name}</b> · ${f.category} · +R$ ${Number(f.extra_price).toFixed(2).replace('.',',')} · ${f.available?'🟢 disponível':'🔴 em falta'} <button class="btn" onclick="toggleFlavor(${f.id},${f.available?0:1})">${f.available?'Marcar em falta':'Disponibilizar'}</button> <button class="btn danger" onclick="deleteFlavor(${f.id})">Excluir</button></div>`).join('');document.getElementById('products').innerHTML=c.products.map(p=>`<div class="item"><b>${p.name}</b> · R$ ${Number(p.price).toFixed(2).replace('.',',')} · ${p.available?'🟢':'🔴'} <button class="btn" onclick="toggleProduct(${p.id},${p.available?0:1})">${p.available?'Em falta':'Disponibilizar'}</button></div>`).join('');}
async function saveSettings(extra={}){const body={delivery_0_300:d1.value,delivery_301_700:d2.value,delivery_701_1000:d3.value,delivery_1001_plus:d4.value,delivery_max_m:dmax.value,...extra};await fetch('/api/admin-settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});loadAdmin()}async function addFlavor(){await fetch('/api/admin-flavor',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'upsert',name:fn.value,category:fc.value,extra_price:fp.value,image_url:fi.value,available:true})});fn.value=fp.value=fi.value='';loadAdmin()}async function toggleFlavor(id,a){await fetch('/api/admin-flavor',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'toggle',id,available:!!a})});loadAdmin()}async function deleteFlavor(id){if(!confirm('Excluir este sabor?'))return;await fetch('/api/admin-flavor',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'delete',id})});loadAdmin()}async function addProduct(){await fetch('/api/admin-product',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'upsert',name:pn.value,category:'Bebidas',price:pp.value,image_url:pi.value,available:true})});pn.value=pp.value=pi.value='';loadAdmin()}async function toggleProduct(id,a){await fetch('/api/admin-product',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'toggle',id,available:!!a})});loadAdmin()}</script></body></html>
